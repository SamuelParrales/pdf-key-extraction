<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Data Extractor</title>
<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    body {
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        background: #f4f6f8;
        color: #1e293b;
    }

    /* APP */

    .app {
        width: 100%;
        height: 100vh;

        padding: 28px 40px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* HEADER */

    .header {
        width: 100%;
        max-width: 1400px;

        margin: 0 auto 20px;

        flex-shrink: 0;
    }

    .header h1 {
        margin: 0;

        font-size: 28px;
        font-weight: 700;

        letter-spacing: -0.5px;
    }

    .header p {
        margin: 6px 0 0;

        color: #64748b;

        font-size: 15px;
    }

    /* MAIN */

    .container {
        width: 100%;
        max-width: 1400px;

        margin: 0 auto;

        flex: 1;
        min-height: 0;

        display: grid;

        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1fr);

        gap: 24px;
    }

    /* PANELS */

    .panel {
        width: 100%;
        height: 100%;

        min-width: 0;
        min-height: 0;

        background: #ffffff;

        border: 1px solid #e2e8f0;
        border-radius: 16px;

        overflow: hidden;

        display: flex;
        flex-direction: column;

        box-shadow:
            0 8px 30px
            rgba(15, 23, 42, 0.05);
    }

    /* PANEL HEADER */

    .panel-header {
        width: 100%;

        padding: 16px 20px;

        border-bottom:
            1px solid #e2e8f0;

        display: flex;

        justify-content:
            space-between;

        align-items: center;

        flex-shrink: 0;
    }

    .panel-title {
        font-size: 16px;
        font-weight: 600;
    }

    .status {
        font-size: 12px;

        padding: 6px 10px;

        border-radius: 20px;

        background: #f1f5f9;

        color: #64748b;

        white-space: nowrap;
    }

    /* LEFT CONTENT */

    .upload-content {
        width: 100%;

        flex: 1;

        min-height: 0;

        padding: 20px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* DROP ZONE */

    .drop-zone {
        width: 100%;

        flex: 1;

        min-height: 0;

        border:
            2px dashed #cbd5e1;

        border-radius: 12px;

        display: flex;

        align-items: center;
        justify-content: center;

        text-align: center;

        cursor: pointer;

        transition:
            all 0.2s ease;

        background: #fafafa;

        padding: 20px;

        overflow: hidden;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
        border-color: #2563eb;

        background: #eff6ff;
    }

    .upload-icon {
        width: 56px;
        height: 56px;

        margin: 0 auto 16px;

        background: #eff6ff;

        color: #2563eb;

        border-radius: 14px;

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 26px;
    }

    .drop-zone h2 {
        margin: 0 0 8px;

        font-size: 18px;
    }

    .drop-zone p {
        margin: 0;

        color: #64748b;

        font-size: 14px;

        line-height: 1.5;
    }

    .file-input {
        display: none;
    }

    .browse-button {
        margin-top: 18px;

        background: #2563eb;

        color: white;

        border: none;

        padding: 10px 18px;

        border-radius: 8px;

        font-weight: 500;

        cursor: pointer;

        font-size: 14px;
    }

    .browse-button:hover {
        background: #1d4ed8;
    }

    /* FILE INFO */

    .file-info {
        display: none;

        width: 100%;

        margin-top: 14px;

        padding: 12px 14px;

        border-radius: 10px;

        background: #f8fafc;

        border:
            1px solid #e2e8f0;

        flex-shrink: 0;
    }

    .file-info.visible {
        display: flex;

        align-items: center;

        justify-content:
            space-between;
    }

    .file-details {
        display: flex;

        flex-direction: column;

        gap: 3px;

        overflow: hidden;

        min-width: 0;
    }

    .file-name {
        font-size: 14px;

        font-weight: 600;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }

    .file-size {
        font-size: 12px;

        color: #64748b;
    }

    .remove-button {
        border: none;

        background: transparent;

        color: #dc2626;

        cursor: pointer;

        font-size: 13px;

        flex-shrink: 0;
    }

    /* EXTRACT BUTTON */

    .extract-button {
        width: 100%;

        margin-top: 14px;

        padding: 13px;

        border: none;

        border-radius: 10px;

        background: #0f172a;

        color: white;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        transition:
            background 0.2s ease;

        flex-shrink: 0;
    }

    .extract-button:hover {
        background: #1e293b;
    }

    .extract-button:disabled {
        background: #cbd5e1;

        cursor: not-allowed;
    }

    /* JSON OUTPUT */

    .output-content {
        width: 100%;

        flex: 1;

        min-height: 0;

        position: relative;

        overflow: hidden;

        background: #0f172a;
    }

    .json-output {
        margin: 0;

        width: 100%;
        height: 100%;

        padding: 20px;

        overflow-y: auto;
        overflow-x: auto;

        color: #e2e8f0;

        font-family:
            "SFMono-Regular",
            Consolas,
            monospace;

        font-size: 13px;

        line-height: 1.6;

        white-space: pre;

        word-wrap: normal;
    }

    /* JSON SCROLLBAR */

    .json-output::-webkit-scrollbar {
        width: 10px;
        height: 10px;
    }

    .json-output::-webkit-scrollbar-track {
        background: #0f172a;
    }

    .json-output::-webkit-scrollbar-thumb {
        background: #334155;

        border-radius: 8px;
    }

    .json-output::-webkit-scrollbar-thumb:hover {
        background: #475569;
    }

    /* JSON COLORS */

    .json-key {
        color: #7dd3fc;
    }

    .json-string {
        color: #86efac;
    }

    .json-number {
        color: #fbbf24;
    }

    .json-boolean {
        color: #c084fc;
    }

    .json-null {
        color: #fb7185;
    }

    .placeholder {
        color: #64748b;
    }

    /* COPY */

    .output-actions {
        display: flex;

        align-items: center;

        gap: 10px;
    }

    .copy-button {
        border:
            1px solid #cbd5e1;

        background: #ffffff;

        color: #334155;

        padding: 7px 12px;

        border-radius: 7px;

        font-size: 12px;

        font-weight: 500;

        cursor: pointer;

        transition:
            all 0.2s ease;
    }

    .copy-button:hover:not(:disabled) {
        background: #f1f5f9;

        border-color: #94a3b8;
    }

    .copy-button:disabled {
        opacity: 0.5;

        cursor: not-allowed;
    }

    /* LOADING */

    .loading {
        display: none;

        position: absolute;

        inset: 0;

        background:
            rgba(15, 23, 42, 0.92);

        align-items: center;

        justify-content: center;

        flex-direction: column;

        gap: 16px;

        color: white;
    }

    .loading.visible {
        display: flex;
    }

    .spinner {
        width: 38px;
        height: 38px;

        border:
            3px solid
            rgba(255, 255, 255, 0.2);

        border-top-color: white;

        border-radius: 50%;

        animation:
            spin 0.8s linear infinite;
    }

    @keyframes spin {

        to {
            transform:
                rotate(360deg);
        }

    }

    /* RESPONSIVE */

    @media (max-width: 900px) {

        html,
        body {
            overflow: auto;
        }

        .app {
            height: auto;

            min-height: 100vh;

            padding: 20px;

            overflow: visible;
        }

        .container {
            grid-template-columns: 1fr;

            flex: none;
        }

        .panel {
            height: 500px;
        }

    }
</style>

</head>

<body>

<div class="app">
<!-- HEADER -->

<header class="header">

    <h1>
        PDF Data Extractor
    </h1>

    <p>
        Upload a PDF document and extract its structured content automatically.
    </p>

</header>


<!-- MAIN -->

<main class="container">


    <!-- LEFT PANEL -->

    <section class="panel">

        <div class="panel-header">

            <span class="panel-title">
                Document
            </span>

            <span
                class="status"
                id="uploadStatus"
            >
                No file selected
            </span>

        </div>


        <div class="upload-content">


            <!-- DROP ZONE -->

            <div
                class="drop-zone"
                id="dropZone"
            >

                <div>

                    <div class="upload-icon">
                        ↑
                    </div>

                    <h2>
                        Upload PDF document
                    </h2>

                    <p>
                        Drag and drop your PDF here
                        <br>
                        or click below to browse
                    </p>

                    <button
                        class="browse-button"
                        type="button"
                    >
                        Choose PDF
                    </button>

                </div>

            </div>


            <input
                type="file"
                id="fileInput"
                class="file-input"
                accept="application/pdf"
            >


            <!-- FILE INFO -->

            <div
                class="file-info"
                id="fileInfo"
            >

                <div class="file-details">

                    <span
                        class="file-name"
                        id="fileName"
                    ></span>

                    <span
                        class="file-size"
                        id="fileSize"
                    ></span>

                </div>

                <button
                    class="remove-button"
                    id="removeButton"
                    type="button"
                >
                    Remove
                </button>

            </div>


            <!-- EXTRACT -->

            <button
                class="extract-button"
                id="extractButton"
                disabled
            >
                Extract Data
            </button>

        </div>

    </section>


    <!-- RIGHT PANEL -->

    <section class="panel">


        <div class="panel-header">

            <span class="panel-title">
                Extracted Data
            </span>


            <div class="output-actions">

                <button
                    class="copy-button"
                    id="copyButton"
                    type="button"
                    disabled
                >
                    Copy JSON
                </button>

                <span
                    class="status"
                    id="outputStatus"
                >
                    Waiting
                </span>

            </div>

        </div>


        <!-- JSON -->

        <div class="output-content">

            <pre
                class="json-output"
                id="jsonOutput"
            ><span class="placeholder">The extracted JSON will appear here.</span></pre>


            <!-- LOADING -->

            <div
                class="loading"
                id="loading"
            >

                <div class="spinner"></div>

                <span>
                    Processing document...
                </span>

            </div>

        </div>

    </section>

</main>

</div>

<script>

    const dropZone =
        document.getElementById(
            "dropZone"
        );

    const fileInput =
        document.getElementById(
            "fileInput"
        );

    const extractButton =
        document.getElementById(
            "extractButton"
        );

    const fileInfo =
        document.getElementById(
            "fileInfo"
        );

    const fileName =
        document.getElementById(
            "fileName"
        );

    const fileSize =
        document.getElementById(
            "fileSize"
        );

    const jsonOutput =
        document.getElementById(
            "jsonOutput"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const uploadStatus =
        document.getElementById(
            "uploadStatus"
        );

    const outputStatus =
        document.getElementById(
            "outputStatus"
        );

    const removeButton =
        document.getElementById(
            "removeButton"
        );

    const copyButton =
        document.getElementById(
            "copyButton"
        );


    let selectedFile = null;

    let currentJson = null;


    /*
    -----------------------------------
    JSON SYNTAX HIGHLIGHTING
    -----------------------------------
    */

    function syntaxHighlight(json) {

        if (
            typeof json !== "string"
        ) {

            json =
                JSON.stringify(
                    json,
                    null,
                    2
                );

        }


        return json.replace(

            /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,

            function(match) {

                let className =
                    "json-number";


                if (
                    /^"/.test(match)
                ) {

                    if (
                        /:$/.test(match)
                    ) {

                        className =
                            "json-key";

                    }
                    else {

                        className =
                            "json-string";

                    }

                }

                else if (
                    /true|false/.test(match)
                ) {

                    className =
                        "json-boolean";

                }

                else if (
                    /null/.test(match)
                ) {

                    className =
                        "json-null";

                }


                return (
                    `<span class="${className}">${match}</span>`
                );

            }
        );

    }


    /*
    -----------------------------------
    FILE SELECTION
    -----------------------------------
    */

    dropZone.addEventListener(
        "click",
        () => {

            fileInput.click();

        }
    );


    fileInput.addEventListener(
        "change",
        (event) => {

            if (
                event.target.files.length > 0
            ) {

                handleFile(
                    event.target.files[0]
                );

            }

        }
    );


    /*
    -----------------------------------
    DRAG & DROP
    -----------------------------------
    */

    dropZone.addEventListener(
        "dragover",
        (event) => {

            event.preventDefault();

            dropZone.classList.add(
                "dragover"
            );

        }
    );


    dropZone.addEventListener(
        "dragleave",
        () => {

            dropZone.classList.remove(
                "dragover"
            );

        }
    );


    dropZone.addEventListener(
        "drop",
        (event) => {

            event.preventDefault();

            dropZone.classList.remove(
                "dragover"
            );


            if (
                event.dataTransfer.files.length > 0
            ) {

                handleFile(
                    event.dataTransfer.files[0]
                );

            }

        }
    );


    /*
    -----------------------------------
    HANDLE FILE
    -----------------------------------
    */

    function handleFile(file) {

        if (
            file.type !==
            "application/pdf"
        ) {

            alert(
                "Please select a valid PDF file."
            );

            return;

        }


        selectedFile =
            file;


        fileName.textContent =
            file.name;


        fileSize.textContent =
            (
                file.size /
                1024 /
                1024
            ).toFixed(2)
            + " MB";


        fileInfo.classList.add(
            "visible"
        );


        extractButton.disabled =
            false;


        uploadStatus.textContent =
            "Ready";


        currentJson =
            null;


        copyButton.disabled =
            true;


        jsonOutput.textContent =
            "File selected. Click 'Extract Data' to process the document.";


        outputStatus.textContent =
            "Ready";

    }


    /*
    -----------------------------------
    REMOVE FILE
    -----------------------------------
    */

    removeButton.addEventListener(
        "click",
        () => {

            selectedFile =
                null;


            fileInput.value =
                "";


            fileInfo.classList.remove(
                "visible"
            );


            extractButton.disabled =
                true;


            uploadStatus.textContent =
                "No file selected";


            outputStatus.textContent =
                "Waiting";


            currentJson =
                null;


            copyButton.disabled =
                true;


            jsonOutput.innerHTML =
                '<span class="placeholder">The extracted JSON will appear here.</span>';

        }
    );


    /*
    -----------------------------------
    API REQUEST
    -----------------------------------
    */

    extractButton.addEventListener(
        "click",
        async () => {

            if (!selectedFile) {
                return;
            }


            const formData =
                new FormData();


            formData.append(
                "file",
                selectedFile
            );


            loading.classList.add(
                "visible"
            );


            extractButton.disabled =
                true;


            outputStatus.textContent =
                "Processing";


            try {

                const response =
                    await fetch(
                        "/invoices/extract",
                        {
                            method: "POST",

                            body: formData
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `API Error: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                currentJson =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );


                jsonOutput.innerHTML =
                    syntaxHighlight(
                        currentJson
                    );


                copyButton.disabled =
                    false;


                outputStatus.textContent =
                    "Completed";

            }

            catch (error) {

                console.error(
                    error
                );


                currentJson =
                    JSON.stringify(
                        {
                            error: true,

                            message:
                                error.message
                        },

                        null,

                        2
                    );


                jsonOutput.innerHTML =
                    syntaxHighlight(
                        currentJson
                    );


                copyButton.disabled =
                    false;


                outputStatus.textContent =
                    "Error";

            }

            finally {

                loading.classList.remove(
                    "visible"
                );


                extractButton.disabled =
                    false;

            }

        }
    );


    /*
    -----------------------------------
    COPY JSON
    -----------------------------------
    */

    copyButton.addEventListener(
        "click",
        async () => {

            if (!currentJson) {
                return;
            }


            try {

                await navigator.clipboard.writeText(
                    currentJson
                );


                const originalText =
                    copyButton.textContent;


                copyButton.textContent =
                    "Copied!";


                setTimeout(
                    () => {

                        copyButton.textContent =
                            originalText;

                    },

                    2000
                );

            }

            catch (error) {

                console.error(
                    "Failed to copy JSON:",
                    error
                );

            }

        }
    );

</script>

</body>
</html>
